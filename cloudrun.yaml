# Reference config for gcloud run services update / deploy
# minScale 0 saves Catalyst trial credits while idle; maxScale 1 keeps one SQLite demo DB
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: apnahaath
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
