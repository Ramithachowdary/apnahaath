# Reference config for gcloud run services update / deploy
# Optional Google Cloud Run path. State lives in Postgres (DATABASE_URL, e.g. Neon) so instances are stateless.
# Set env vars with: gcloud run services update apnahaath --set-env-vars=... (or Secret Manager).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: apnahaath
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
