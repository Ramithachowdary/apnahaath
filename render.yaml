# Render Blueprint — alternative to Vercel (Docker). Set DATABASE_URL (Neon) for persistent data.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: apnahaath
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      # Secrets: Render prompts for these on first Blueprint deploy (never commit values)
      - key: SESSION_SECRET
        sync: false
      - key: RESET_ADMIN_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Optional: where demo-household reminder emails go
      - key: NOTIFY_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADAPTION_API_KEY
        sync: false
